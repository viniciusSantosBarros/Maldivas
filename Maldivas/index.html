<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Maldives</title>

        <!-- CSS -->
        <link rel="stylesheet" href="style.css">

        <!-- GSAP -->
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

        <!-- JS -->
        <script src="js/script.js" defer></script>
    </head>

    <body>

        <section class="hero">
            <picture>
                <source media="(min-width: 992px)" srcset="assets/hero/maldives_hotel_desktop.webp">

                <img src="assets/hero/maldives_hotel_mobile.webp" alt="Hotel Maldivas">
            </picture>

            <img class="reserva" src="assets/hero/reserva.svg" alt="reserva">
        </section>

        <section class="sliders">
            <img src="assets/sliders/Layer_1.png" alt="img1">
            <img src="assets/sliders/Layer_2.png" alt="img2">
            <img src="assets/sliders/Layer_3.png" alt="img3">
            <img src="assets/sliders/Layer_4.png" alt="img4">
            <img src="assets/sliders/Layer_5.png" alt="img5">
            <img src="assets/sliders/layer_6.png" alt="img6">
            <img src="assets/sliders/Layer_7.png" alt="img7">
            <img src="assets/sliders/Layer_8.png" alt="img8">
            <img src="assets/sliders/Layer_9.png" alt="img9">
            <img src="assets/sliders/layer_10.png" alt="img10">
            <img src="assets/sliders/Layer_11.png" alt="img11">
        </section>

    </body>

</html>
